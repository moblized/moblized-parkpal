name: Build APK

on:
  push:
    branches: [main]
    # Only app changes make a new APK (and an update prompt); server-only changes don't.
    paths-ignore:
      - "server/**"
      - "README.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/diag.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build optimized APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Missing class|R8:" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK and write release notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk ParkPal.apk
          git log -1 --pretty=%s > notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ParkPal-apk
          path: ParkPal.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ParkPal build ${{ github.run_number }}
          body_path: notes.txt
          files: ParkPal.apk
          make_latest: true
