name: Build APK

on:
  push:
    # "next" is for test builds of bigger changes: built and checked, but not published.
    branches: [main, next]
    # Only app changes make a new APK (and an update prompt); server-only changes don't.
    paths-ignore:
      - "server/**"
      - "README.md"
      - ".github/workflows/server.yml"
      - ".github/workflows/diag.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sample routes for the navigation tests
        continue-on-error: true
        run: |
          mkdir -p app/src/test/resources/routes
          q="overview=full&geometries=geojson&steps=true"
          d=app/src/test/resources/routes
          curl -sf --max-time 30 "https://router.project-osrm.org/route/v1/driving/-77.0063,38.8973;-77.0365,38.8977?$q" -o $d/dc_drive.json || true
          curl -sf --max-time 30 "https://router.project-osrm.org/route/v1/driving/-77.0063,38.8973;-76.6122,39.2904?$q" -o $d/highway_drive.json || true
          curl -sf --max-time 30 "https://routing.openstreetmap.de/routed-car/route/v1/driving/-77.0063,38.8973;-77.0502,38.8893?$q" -o $d/fossgis_drive.json || true
          curl -sf --max-time 30 "https://routing.openstreetmap.de/routed-foot/route/v1/driving/-77.0063,38.8973;-77.0090,38.8899?$q" -o $d/walk.json || true
          ls -la $d

      - name: Unit tests (navigation)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Show navigation instructions
        if: always()
        run: |
          grep -E "NAV\||FAILED|AssertionError|expected" test.log | sed 's/^.*NAV|//' | head -10 | while IFS= read -r line; do
            echo "::notice::$line"
          done

      - name: Build optimized APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|Missing class|R8:" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK and write release notes
        run: |
          cp app/build/outputs/apk/release/app-release.apk ParkPal.apk
          git log -1 --pretty=%s > notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ParkPal-apk
          path: ParkPal.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ParkPal build ${{ github.run_number }}
          body_path: notes.txt
          files: ParkPal.apk
          make_latest: true
